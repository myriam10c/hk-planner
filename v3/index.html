<body>
<!-- #view est le seul conteneur reecrit a chaque rendu ; la video du viseur est
     permanente (jamais recreee par un rendu, le flux n'est branche qu'une fois). -->
<div id="app" tabindex="-1"><div id="view"></div><video id="vf" autoplay playsinline muted hidden></video></div>
<div id="toast-host" aria-live="polite" role="status"></div>
<input id="cam-fallback" type="file" accept="image/*" capture="environment" hidden>
<!-- supabase-js avant le module : la v3 partage le client de session de l'app
     actuelle (renouvellement du jeton email). Balise classique, non bloquante
     pour l'app : sans elle, /v3/session.js retombe sur la lecture directe. -->
<script src="/vendor/supabase-js-2.116.0.umd.js"></script>
<script type="module" src="/v3/app.js"></script>
